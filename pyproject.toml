[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gitfix-agent"
version = "0.1.0"
description = "Autonomous repository-agnostic AI software maintenance agent"
readme = "README.md"
authors = [{ name = "GitFix Team" }]
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "rich>=12.0.0",
    "pyyaml>=6.0",
    "gitpython>=3.1.0",
    "google-genai>=0.1.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
gitfix = "gitfix.cli:cli"
